name: release

on:
  push:
    tags: ["v*"]

jobs:
  release-gate:
    name: Release gate (build + L0/L1/L6 + archives)
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"
      CTEST_OUTPUT_ON_FAILURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --quiet pytest jinja2
        shell: bash

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF -DBUILD_TESTING=ON
        shell: bash

      - name: Build (Release)
        run: cmake --build build --config Release -j
        shell: bash

      - name: L0 functional self-tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: L1 pytest suite
        run: python -m pytest tests/ -q

      - name: L6 implementation-completeness audit
        run: python scripts/audit_completeness.py --report

      - name: CPack archives
        run: cmake --build build --config Release --target package

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: HummingFlight-windows
          path: dist/

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: reports/