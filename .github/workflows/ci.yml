name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# The `release` job creates a GitHub Release and uploads assets, which needs
# write access to the repository contents. Branches/PRs never reach it.
permissions:
  contents: write

jobs:
  build-and-gates:
    name: Build + L0/L1/L6 gates
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUNBUFFERED: "1"
      CTEST_OUTPUT_ON_FAILURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --quiet pytest jinja2
        shell: bash

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF -DBUILD_TESTING=ON
        shell: bash

      - name: Build (Release)
        run: cmake --build build --config Release -j
        shell: bash

      - name: L0 functional self-tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: L1 pytest suite
        run: python -m pytest tests/ -q

      - name: L6 implementation-completeness audit
        run: python scripts/audit_completeness.py --report

      # Packages are produced for every supported OS, but only for default-branch
      # pushes: branch/PR runs keep the matrix fast.
      - name: CPack archives (default-branch push only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: cmake --build build --config Release --target package
        shell: bash

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports-${{ matrix.os }}
          path: reports/

      - name: Upload release archives
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: release-archives-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    # Auto-publish: a merge to the default branch that passes every gate job
    # creates the GitHub Release named from scripts/sync_version.py (the single
    # version source). The same-version release already exists -> skip, so only
    # a version bump produces a new Release. No manual v* tag is required.
    name: Publish GitHub Release (auto)
    needs: build-and-gates
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from sync_version.py
        id: ver
        run: |
          echo "VERSION=$(python scripts/sync_version.py --show)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Collect release archives (all platforms)
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-archives-*
          merge-multiple: true

      - name: Collect gate reports
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: gate-reports-*
          merge-multiple: true

      - name: Publish release v${{ steps.ver.outputs.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; skipping auto-publish"
            exit 0
          fi
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --title "HummingFlight v$VERSION" \
            $(find release -type f)
        shell: bash