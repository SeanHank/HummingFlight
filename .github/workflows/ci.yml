name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# The `release` job creates a GitHub Release and uploads assets, which needs
# write access to the repository contents. Branches/PRs never reach it.
permissions:
  contents: write

jobs:
  build-and-gates:
    name: Build + L0/L1/L6 gates
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUNBUFFERED: "1"
      CTEST_OUTPUT_ON_FAILURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --quiet pytest jinja2
        shell: bash

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF -DBUILD_TESTING=ON
        shell: bash

      - name: Build (Release)
        run: cmake --build build --config Release -j
        shell: bash

      - name: L0 functional self-tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: L1 pytest suite
        run: python -m pytest tests/ -q

      - name: L6 implementation-completeness audit
        run: python scripts/audit_completeness.py --report

      # Packages are produced for every supported OS, but only for release tags:
      # branch/PR runs keep the matrix fast.
      - name: CPack archives (release tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cmake --build build --config Release --target package
        shell: bash

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports-${{ matrix.os }}
          path: reports/

      - name: Upload release archives
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-archives-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release (tag gate passed)
    needs: build-and-gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect release archives (all platforms)
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-archives-*
          merge-multiple: true

      - name: Collect gate reports
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: gate-reports-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true