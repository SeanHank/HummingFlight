name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-gates:
    name: Build + L0/L1/L6 gates
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUNBUFFERED: "1"
      CTEST_OUTPUT_ON_FAILURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --quiet pytest jinja2
        shell: bash

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF -DBUILD_TESTING=ON
        shell: bash

      - name: Build (Release)
        run: cmake --build build --config Release -j
        shell: bash

      - name: L0 functional self-tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: L1 pytest suite
        run: python -m pytest tests/ -q

      - name: L6 implementation-completeness audit
        run: python scripts/audit_completeness.py --report

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports-${{ matrix.os }}
          path: reports/